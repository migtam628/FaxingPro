services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PORT=8088
      - HOST=0.0.0.0
      - FAX_TRANSPORT=disabled
    expose:
      - "8088"
    security_opt:
      - no-new-privileges:true
