name: faxingpro-telnyx
services:
  web:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FAXINGPRO_HTTP_PORT:-8092}:80"
    depends_on:
      - api
    security_opt:
      - no-new-privileges:true
  api:
    build:
      context: ../..
      dockerfile: server/telnyx.Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: "8088"
      DATABASE_URL: postgres://faxingpro:${DB_PASSWORD:?set DB_PASSWORD}@db:5432/faxingpro
      FILE_DIR: /data/files
    volumes:
      - fax_documents:/data
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: faxingpro
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD}
      POSTGRES_DB: faxingpro
    volumes:
      - fax_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faxingpro -d faxingpro"]
      interval: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
volumes:
  fax_documents:
  fax_database:
