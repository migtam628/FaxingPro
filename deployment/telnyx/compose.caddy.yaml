# Optional HTTPS service for a fresh standalone VPS. Do not run with existing 80/443 proxy.
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      FAXINGPRO_DOMAIN: ${FAXINGPRO_DOMAIN:?set FAXINGPRO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    security_opt:
      - no-new-privileges:true
volumes:
  caddy_data:
  caddy_config:
