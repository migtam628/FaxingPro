name: Deploy ATLAS Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify web application
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run API tests
        run: npm test
      - name: Build ATLAS for GitHub Pages
        env:
          VITE_BASE_PATH: /FaxingPro/
        run: npm run build
      - name: Validate website and asset URLs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          grep -q '/FaxingPro/assets/' dist/index.html
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import urlsplit, unquote

          base = "/FaxingPro/"
          root = Path("dist")
          html = (root / "index.html").read_text(encoding="utf-8")

          class AssetReferences(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.references = []

              def handle_starttag(self, tag, attrs):
                  attributes = dict(attrs)
                  if tag == "script" and "src" in attributes:
                      self.references.append(attributes["src"])
                  if tag == "link" and attributes.get("rel") in ("stylesheet", "modulepreload") and "href" in attributes:
                      self.references.append(attributes["href"])

          parser = AssetReferences()
          parser.feed(html)
          assert parser.references, "No script or stylesheet references found in built HTML"
          for reference in parser.references:
              path = unquote(urlsplit(reference).path)
              assert path.startswith(base + "assets/"), f"Unexpected asset URL: {reference}"
              relative = Path(path.removeprefix(base))
              assert ".." not in relative.parts, f"Unsafe asset path: {reference}"
              target = root / relative
              assert target.is_file() and target.stat().st_size > 0, f"Missing or empty asset: {reference}"
          print(f"Verified {len(parser.references)} built script/style asset references")
          PY
          touch dist/.nojekyll
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish website
    timeout-minutes: 15
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
