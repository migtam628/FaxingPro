name: Deploy ATLAS Website to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify web application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run API tests
        run: npm test
      - name: Build ATLAS for GitHub Pages
        env:
          VITE_BASE_PATH: /FaxingPro/
        run: npm run build
      - name: Validate website and asset URLs
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -d dist/assets
          grep -q '/FaxingPro/assets/' dist/index.html
          touch dist/.nojekyll
      - name: Upload compiled site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    name: Publish website
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
