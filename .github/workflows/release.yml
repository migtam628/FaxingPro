            tag="${GITHUB_REF#refs/tags/}"
            gh release create "$tag" "${files[@]}" --verify-tag --title "FaxingPro $tag" --generate-notes
          else
            tag="v0.1.0-preview.${GITHUB_RUN_NUMBER}"
            gh release create "$tag" "${files[@]}" --target "$GITHUB_SHA" --title "FaxingPro $tag" --prerelease --notes "Unsigned preview desktop builds for Windows, macOS (Intel/Apple silicon), and Linux; download faxingpro-install.sh for guided Ubuntu VPS installation. On first launch, connect to your OWN trusted HTTPS FaxingPro server; the installer does not contain a backend or demo data. Production faxing is provided by your self-hosted Telnyx service with the server-side TEST_DESTINATION restrictions. Review the README and deployment guide before use."
          fi
 README.md
          test -s docs/VPS_ONE_CLICK_INSTALL.md
          bash -n scripts/install-vps.sh
          bash scripts/install-vps.sh --self-test
      - name: Build web app
        run: npm run build

