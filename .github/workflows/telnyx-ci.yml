name: Validate Telnyx Fax Backend

on:
  push:
    branches: [main]
    paths:
      - 'server/telnyx*'
      - 'scripts/faxingpro-*.sh'
      - 'scripts/install-vps.sh'
      - 'scripts/install-faxingpro-*.sh'
      - 'tests/faxingpro-drive-ci.sh'
      - 'tests/faxingpro-restore-ci.sh'
      - 'src/types.ts'
      - 'deployment/telnyx/**'
      - 'deployment/nginx.conf'
      - 'tests/telnyx*.mjs'
      - 'tests/prepare-telnyx-ci.mjs'
      - 'src/api.ts'
      - 'src/App.tsx'
      - 'src/ReconciliationPanel.tsx'
      - 'src/ContactsManager.tsx'
      - 'src/NotificationCenter.tsx'
      - 'src/PublicLanding.tsx'
      - 'src/notifications.css'
      - '.github/workflows/telnyx-ci.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  telnyx-backend:
    name: API syntax, tests and Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate backup and recovery shell syntax
        run: |
          bash -n scripts/faxingpro-backup.sh
          bash -n scripts/install-vps.sh
          bash scripts/install-vps.sh --self-test
          bash scripts/install-vps.sh --help >/dev/null
          bash -n scripts/faxingpro-verify-backup.sh
          bash -n scripts/install-faxingpro-backup-timer.sh
          bash -n scripts/faxingpro-drive-upload.sh
          bash -n scripts/install-faxingpro-drive.sh
          bash -n tests/faxingpro-drive-ci.sh
          bash -n tests/faxingpro-restore-ci.sh
      - name: Validate Node module syntax
        run: |
          node --check server/telnyx.mjs
          node --check server/telnyx-utils.mjs
      - name: Run API and webhook security tests
        run: npm test
      - name: Prepare ephemeral signed-webhook fixture and Compose secrets
        run: node tests/prepare-telnyx-ci.mjs
      - name: Validate isolated Docker Compose configuration
        run: docker compose -f deployment/telnyx/compose.yaml --env-file deployment/telnyx/.env config --quiet
      - name: Validate optional standalone HTTPS Compose overlay
        run: |
          FAXINGPRO_DOMAIN=fax.example.invalid docker compose \
            -f deployment/telnyx/compose.yaml -f deployment/telnyx/compose.caddy.yaml \
            --env-file deployment/telnyx/.env config --quiet
      - name: Verify scheduled backup preflight without installing systemd services
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age-keygen -o "$RUNNER_TEMP/timer-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/timer-identity.txt")"
          FAXINGPRO_AGE_RECIPIENT="$recipient" bash scripts/install-faxingpro-backup-timer.sh --check
          test ! -f /etc/systemd/system/faxingpro-backup.timer
      - name: Build FaxingPro Telnyx API container
        run: docker build -f server/telnyx.Dockerfile -t faxingpro-telnyx-api:ci .
      - name: Start isolated pilot stack with sending disabled
        run: docker compose -f deployment/telnyx/compose.yaml --env-file deployment/telnyx/.env up -d --build
      - name: Verify signed webhooks, auth, and persistent fax rows
        run: node tests/telnyx-smoke.mjs
      - name: Seed encrypted test PDF for full recovery rehearsal
        run: bash tests/faxingpro-restore-ci.sh seed "$RUNNER_TEMP/recovery-fixture"
      - name: Exercise real encrypted backup streams and manifest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          age-keygen -o "$RUNNER_TEMP/recovery-identity.txt"
          recipient="$(age-keygen -y "$RUNNER_TEMP/recovery-identity.txt")"
          FAXINGPRO_AGE_RECIPIENT="$recipient" FAXINGPRO_BACKUP_DIR="$RUNNER_TEMP/backup-archives" bash scripts/faxingpro-backup.sh
          archive="$(find "$RUNNER_TEMP/backup-archives" -mindepth 1 -maxdepth 1 -type d | head -1)"
          test -n "$archive"
          (cd "$archive" && sha256sum -c SHA256SUMS)
          age -d -i "$RUNNER_TEMP/recovery-identity.txt" "$archive/database.dump.age" |
            docker run --rm -i --network none postgres:17-alpine pg_restore --list > /dev/null
          age -d -i "$RUNNER_TEMP/recovery-identity.txt" "$archive/documents.tar.age" | tar -tf - > /dev/null
          age -d -i "$RUNNER_TEMP/recovery-identity.txt" "$archive/config.env.age" |
            awk '/^STORAGE_ENCRYPTION_KEY=/{found=1} END{exit !found}'
          count="$(docker compose -f deployment/telnyx/compose.yaml --env-file deployment/telnyx/.env exec -T db psql -U faxingpro -d faxingpro -tAc 'SELECT count(*) FROM backup_runs')"
          test "$count" -eq 1
          node tests/telnyx-backup-monitor.mjs
          bash tests/faxingpro-restore-ci.sh restore "$RUNNER_TEMP/recovery-fixture" \
            "$archive" "$RUNNER_TEMP/recovery-identity.txt"
      - name: Verify encrypted Google Drive uploader with a mocked rclone remote
        run: |
          bash tests/faxingpro-drive-ci.sh "$RUNNER_TEMP/backup-archives"
      - name: Shutdown test stack
        if: always()
        run: docker compose -f deployment/telnyx/compose.yaml --env-file deployment/telnyx/.env down || true
