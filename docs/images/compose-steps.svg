<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 285" width="1120" height="285" role="img" aria-label="Illustrated new fax draft workflow: recipient, PDF attachment, local preview and future delivery.">
<rect x="0" y="0" width="1120" height="285" rx="16" fill="#F5F8FC" stroke="none"/>
<text x="25" y="45" fill="#1B334F" font-size="25" font-family="Inter,Arial,sans-serif" font-weight="800">Compose a fax draft in ATLAS</text>
<text x="25" y="67" fill="#74869F" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="500">Four steps in the current preview — nothing is sent to a telephone number.</text>
<rect x="22" y="100" width="263" height="149" rx="11" fill="#FFF" stroke="#DEE7EF"/>
<rect x="37" y="117" width="35" height="35" rx="8" fill="#E2F7EF" stroke="none"/>
<text x="49" y="141" fill="#0A977F" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">1</text>
<text x="37" y="184" fill="#263F58" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">Enter recipient</text>
<text x="37" y="211" fill="#7589A1" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="500">+1 (555) ...</text>
<line x1="286" y1="174" x2="300" y2="174" stroke="#0A9689" stroke-width="3"/>
<rect x="301" y="100" width="263" height="149" rx="11" fill="#FFF" stroke="#DEE7EF"/>
<rect x="316" y="117" width="35" height="35" rx="8" fill="#E2F7EF" stroke="none"/>
<text x="328" y="141" fill="#0A977F" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">2</text>
<text x="316" y="184" fill="#263F58" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">Attach a PDF</text>
<text x="316" y="211" fill="#7589A1" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="500">1 file, 10 MB max</text>
<line x1="565" y1="174" x2="579" y2="174" stroke="#0A9689" stroke-width="3"/>
<rect x="580" y="100" width="263" height="149" rx="11" fill="#FFF" stroke="#DEE7EF"/>
<rect x="595" y="117" width="35" height="35" rx="8" fill="#E2F7EF" stroke="none"/>
<text x="607" y="141" fill="#0A977F" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">3</text>
<text x="595" y="184" fill="#263F58" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">Review + save</text>
<text x="595" y="211" fill="#7589A1" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="500">Draft metadata only</text>
<line x1="844" y1="174" x2="858" y2="174" stroke="#0A9689" stroke-width="3"/>
<rect x="859" y="100" width="263" height="149" rx="11" fill="#FFF" stroke="#DEE7EF"/>
<rect x="874" y="117" width="35" height="35" rx="8" fill="#FFF0DC" stroke="none"/>
<text x="886" y="141" fill="#C08F3C" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">4</text>
<text x="874" y="184" fill="#263F58" font-size="17" font-family="Inter,Arial,sans-serif" font-weight="800">Real fax: planned</text>
<text x="874" y="211" fill="#7589A1" font-size="12" font-family="Inter,Arial,sans-serif" font-weight="500">Transport not connected</text>
<text x="27" y="274" fill="#9A702E" font-size="11" font-family="Inter,Arial,sans-serif" font-weight="700">Important: Saving a draft never saves the uploaded PDF bytes. Keep the original file.</text>
</svg>